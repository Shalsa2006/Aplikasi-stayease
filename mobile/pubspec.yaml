name: stayease
description: StayEase - aplikasi pemesanan hotel (Flutter + REST API Node.js + MySQL).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0' # Flutter 3.27 ke atas

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  barcode_widget: ^2.0.4   # QR code & barcode untuk QRIS dan bukti pembayaran
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
